<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#00c2ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ZEST" />
  <meta name="description" content="BTGT борлуулалтын систем" />

  <title>ZEST</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Apple Touch Icons (iPhone-д зориулсан) -->
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />

  <!-- Apple Splash Screens -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0e1a; font-family: sans-serif; overflow: hidden; }
    #root { height: 100vh; width: 100vw; }

    /* Install Banner */
    #install-banner {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a2236;
      border: 1px solid #00c2ff44;
      border-radius: 14px;
      padding: 14px 20px;
      z-index: 9999;
      width: calc(100% - 40px);
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,194,255,0.15);
    }
    #install-banner.show { display: flex; align-items: center; gap: 14px; }
    #install-banner .icon { font-size: 32px; }
    #install-banner .text { flex: 1; }
    #install-banner .text h4 { color: #e8f0fe; font-size: 14px; margin-bottom: 3px; }
    #install-banner .text p { color: #6b7fa3; font-size: 12px; }
    #install-banner .actions { display: flex; gap: 8px; flex-shrink: 0; }
    #install-banner button {
      border: none; border-radius: 8px; padding: 8px 14px;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    #btn-install { background: #00c2ff; color: #000; }
    #btn-dismiss { background: #1e2d45; color: #6b7fa3; }

    /* iOS instruction banner */
    #ios-banner {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a2236;
      border: 1px solid #00c2ff44;
      border-radius: 14px;
      padding: 16px 20px;
      z-index: 9999;
      width: calc(100% - 40px);
      max-width: 420px;
      text-align: center;
    }
    #ios-banner.show { display: block; }
    #ios-banner h4 { color: #e8f0fe; font-size: 14px; margin-bottom: 8px; }
    #ios-banner p { color: #6b7fa3; font-size: 13px; line-height: 1.6; }
    #ios-banner .share-icon { font-size: 18px; vertical-align: middle; }
    #ios-close {
      margin-top: 12px; background: #1e2d45; color: #6b7fa3;
      border: none; border-radius: 8px; padding: 7px 18px;
      font-size: 13px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Android Install Banner -->
  <div id="install-banner">
    <div class="icon">📱</div>
    <div class="text">
      <h4>ZEST суулгах</h4>
      <p>Утсандаа апп болгон нэмэх</p>
    </div>
    <div class="actions">
      <button id="btn-dismiss">Үгүй</button>
      <button id="btn-install">Суулгах</button>
    </div>
  </div>

  <!-- iOS Install Banner -->
  <div id="ios-banner">
    <h4>📱 iPhone-дээ суулгах заавар</h4>
    <p>
      1. Доорх <span class="share-icon">⬆️</span> Share товч дарна<br/>
      2. <strong style="color:#e8f0fe">"Add to Home Screen"</strong> сонгоно<br/>
      3. <strong style="color:#00c2ff">"Add"</strong> дарна
    </p>
    <button id="ios-close">Ойлголоо</button>
  </div>

  <!-- React + App -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" type="text/css"></script>

  <!-- Load the main app -->
  <script type="text/babel" src="/app.jsx"></script>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.log('SW error:', err));
      });
    }

    // Android - Install prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('install-banner').classList.add('show');
    });

    document.getElementById('btn-install').addEventListener('click', () => {
      document.getElementById('install-banner').classList.remove('show');
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(choice => {
          deferredPrompt = null;
        });
      }
    });

    document.getElementById('btn-dismiss').addEventListener('click', () => {
      document.getElementById('install-banner').classList.remove('show');
    });

    // iOS - Show install instructions
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isInStandaloneMode = window.navigator.standalone;
    if (isIOS && !isInStandaloneMode) {
      setTimeout(() => {
        document.getElementById('ios-banner').classList.add('show');
      }, 3000);
    }

    document.getElementById('ios-close').addEventListener('click', () => {
      document.getElementById('ios-banner').classList.remove('show');
    });

    // Hide banner when installed
    window.addEventListener('appinstalled', () => {
      document.getElementById('install-banner').classList.remove('show');
    });
  </script>
</body>
</html>
